name: Release

# Manually triggered full release: validates the version, runs the test gate
# (lint, unit specs, and live system specs), then hands over to the official
# rubygems/release-gem action — which builds the gem, creates and pushes the
# vX.Y.Z tag, and publishes to RubyGems via OIDC Trusted Publishing (no API
# key secret) — and finally creates a GitHub Release whose notes are taken
# from the matching section of CHANGELOG.md.
#
# Requirements:
# - lib/ipregistry/version.rb must already declare the version being released.
# - CHANGELOG.md must already contain a "## [X.Y.Z] - <date>" section.
# - A trusted publisher configured on rubygems.org for the "ipregistry" gem,
#   pointing at this repository, workflow file "release.yaml", and environment
#   "release". For the very first release, register it as a *pending* trusted
#   publisher (Profile -> Trusted publishers) since the gem does not exist on
#   rubygems.org yet; the first successful push converts it to a normal one.
#   See https://guides.rubygems.org/trusted-publishing/
# - Secret IPREGISTRY_API_KEY for the system-test gate. No RubyGems API key
#   is needed thanks to trusted publishing.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. 1.2.0 or v1.2.0'
        required: true
        type: string

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # push the release tag, create the GitHub Release
      id-token: write # mandatory for RubyGems Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '4.0'
          bundler-cache: true

      - name: Validate version
        # The raw input is passed through the environment (never interpolated
        # into the shell) and strictly validated before any further use.
        env:
          VERSION_INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${VERSION_INPUT#v}"
          if ! printf '%s' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Invalid version '$VERSION_INPUT'. Expected semver such as 1.2.0 or v1.2.0."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=v$version" >> "$GITHUB_ENV"

      - name: Ensure version.rb matches
        run: |
          set -euo pipefail
          declared="$(ruby -r ./lib/ipregistry/version -e 'puts Ipregistry::VERSION')"
          if [ "$declared" != "$VERSION" ]; then
            echo "::error::lib/ipregistry/version.rb declares $declared but the release input is $VERSION."
            exit 1
          fi

      - name: Ensure tag does not already exist
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::Tag $TAG already exists on the remote."
            exit 1
          fi

      - name: Extract changelog section
        # Written outside the workspace: rake release (run by release-gem
        # below) requires a pristine git tree.
        run: |
          set -euo pipefail
          awk -v ver="$VERSION" '
            $0 ~ ("^## \\[" ver "\\]") { capture=1; next }
            capture && (/^## / || /^\[[^][]+\]:[[:space:]]/) { exit }
            capture { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > "$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
            echo "::error::No changelog section found for [$VERSION] in CHANGELOG.md."
            exit 1
          fi
          echo "Release notes for $TAG:"
          echo "----------------------------------------"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "----------------------------------------"

      - name: Run lint and local specs
        run: |
          bundle exec rubocop
          bundle exec rake spec

      - name: Run system specs (live API)
        env:
          IPREGISTRY_API_KEY: ${{ secrets.IPREGISTRY_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${IPREGISTRY_API_KEY:-}" ]; then
            echo "::error::IPREGISTRY_API_KEY secret is required to run system specs before a release."
            exit 1
          fi
          bundle exec rake system

      - name: Build, tag, and publish to RubyGems (Trusted Publishing)
        # Runs `rake release`: builds pkg/ipregistry-X.Y.Z.gem, creates and
        # pushes the vX.Y.Z tag, publishes via OIDC, and waits until the gem
        # is available on rubygems.org.
        #
        # The default Actions token (GITHUB_TOKEN) may be blocked by an
        # organization rule from creating v*-prefixed tags. Provide a
        # RELEASE_TOKEN secret (a PAT owned by a user allowed to create such
        # tags, with Contents: write) so the tag is pushed as that user.
        uses: rubygems/release-gem@v1
        with:
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          prerelease=""
          case "$VERSION" in
            *-*) prerelease="--prerelease" ;;
          esac
          gh release create "$TAG" "pkg/ipregistry-$VERSION.gem" \
            --verify-tag \
            --title "$TAG" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            $prerelease
          echo "Released $TAG: ${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG"
